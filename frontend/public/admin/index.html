<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Admin CMS — Kontrakan Coffee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Serif:wdth,wght@52,700..900&display=swap"
      rel="stylesheet"
    />
    <!-- Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      // Bersihkan cache Netlify Identity lama di browser saat berjalan di localhost
      if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
        try {
          localStorage.removeItem("netlifySiteURL");
          localStorage.removeItem("gotrue.user");
        } catch (e) {}
      }
    </script>
    <style>
      :root {
        --kc-coffee: #2c1c0f;
        --kc-coffee-dark: #23160c;
        --kc-cream: #f7f4ed;
        --kc-latte: #edd5b7;
        --kc-sunshine: #fcbf27;
        --kc-earth: #ed612f;
      }

      html,
      body {
        background-color: var(--kc-cream);
        color: var(--kc-coffee);
        font-family: "Roboto", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #nc-root header {
        background-color: var(--kc-coffee) !important;
        border-bottom: 2px solid var(--kc-sunshine) !important;
      }

      #nc-root header a,
      #nc-root header button,
      #nc-root header span {
        color: var(--kc-cream) !important;
      }

      #nc-root :focus-visible {
        outline: 2px solid var(--kc-earth);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", function (user) {
          if (!user) {
            window.netlifyIdentity.on("login", function () {
              document.location.href = "/admin/";
            });
          }
        });
      }

      if (window.CMS) {
        CMS.registerPreviewStyle(
          [
            "@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Serif:wdth,wght@52,700..900&display=swap');",
            "body { margin: 0; padding: 24px; background: #f7f4ed; color: #2c1c0f; font-family: 'Roboto', system-ui, sans-serif; line-height: 1.5; }",
            ".kc-card { max-width: 440px; background: #f9f7f2; border: 1px solid rgba(44,28,15,0.22); border-radius: 0.4rem; overflow: hidden; box-shadow: 0 2px 0 rgba(44,28,15,0.12); }",
            ".kc-media { width: 100%; height: 220px; object-fit: cover; display: block; background: #edd5b7; }",
            ".kc-body { padding: 20px; }",
            ".kc-tag { display: inline-block; padding: 3px 9px; border-radius: 0.2rem; background: #fcbf27; color: #2c1c0f; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }",
            ".kc-tag-earth { background: #ed612f; color: #f7f4ed; }",
            ".kc-title { margin: 10px 0 4px; font-family: 'Roboto Serif', Georgia, serif; font-weight: 900; font-stretch: 52%; font-size: 28px; line-height: 1; color: #2c1c0f; }",
            ".kc-price { margin: 4px 0 12px; font-size: 18px; font-weight: 700; color: #ed612f; }",
            ".kc-meta { font-size: 13px; color: #6b6057; margin-bottom: 4px; }",
            ".kc-prose { margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(44,28,15,0.14); font-size: 14px; color: #2c1c0f; }",
          ].join("\n"),
          { raw: true }
        );

        CMS.registerPreviewTemplate(
          "menu",
          createClass({
            render: function () {
              var entry = this.props.entry;
              var nama = entry.getIn(["data", "nama"]) || "Nama Menu";
              var harga = entry.getIn(["data", "harga"]) || 0;
              var rekomendasi = entry.getIn(["data", "rekomendasi"]);
              var fotoRaw = entry.getIn(["data", "foto"]);
              var foto = fotoRaw ? this.props.getAsset(fotoRaw) : null;
              var body = this.props.widgetFor("body");
              var ukuran = entry.getIn(["data", "ukuran"]);
              var rasa = entry.getIn(["data", "rasa"]);

              return h(
                "div",
                { className: "kc-card" },
                foto ? h("img", { src: foto.toString(), className: "kc-media" }) : null,
                h(
                  "div",
                  { className: "kc-body" },
                  rekomendasi ? h("span", { className: "kc-tag" }, "Pilihan Barista") : null,
                  h("h2", { className: "kc-title" }, nama),
                  h("p", { className: "kc-price" }, "Rp " + Number(harga).toLocaleString("id-ID")),
                  ukuran && ukuran.size
                    ? h("div", { className: "kc-meta" }, "Ukuran: " + ukuran.toJS().join(", "))
                    : null,
                  rasa && rasa.size
                    ? h("div", { className: "kc-meta" }, "Varian: " + rasa.toJS().join(", "))
                    : null,
                  h("div", { className: "kc-prose" }, body)
                )
              );
            },
          })
        );

        CMS.registerPreviewTemplate(
          "promo",
          createClass({
            render: function () {
              var entry = this.props.entry;
              var judul = entry.getIn(["data", "judul"]) || "Judul Promo";
              var tipe = entry.getIn(["data", "tipe"]) || "promo";
              var deskripsi = entry.getIn(["data", "deskripsi"]) || "";
              var selesai = entry.getIn(["data", "tanggal_selesai"]) || "";
              var formatSelesai = selesai;
              try {
                if (selesai) {
                  var d = new Date(selesai.split("T")[0] + "T00:00:00Z");
                  if (!isNaN(d.getTime())) {
                    formatSelesai = d.toLocaleDateString("id-ID", {
                      weekday: "long",
                      day: "numeric",
                      month: "long",
                      timeZone: "UTC",
                    });
                  }
                }
              } catch (e) {}
              var gambarRaw = entry.getIn(["data", "gambar"]);
              var gambar = gambarRaw ? this.props.getAsset(gambarRaw) : null;

              return h(
                "div",
                { className: "kc-card" },
                gambar ? h("img", { src: gambar.toString(), className: "kc-media" }) : null,
                h(
                  "div",
                  { className: "kc-body" },
                  h(
                    "span",
                    { className: tipe === "promo" ? "kc-tag kc-tag-earth" : "kc-tag" },
                    tipe
                  ),
                  h("h2", { className: "kc-title" }, judul),
                  h("p", { style: { fontSize: "14px", margin: "8px 0 0" } }, deskripsi),
                  h(
                    "div",
                    { className: "kc-prose kc-meta" },
                    "Berlaku sampai: " + (formatSelesai || "-")
                  )
                )
              );
            },
          })
        );

        CMS.registerPreviewTemplate(
          "galeri",
          createClass({
            render: function () {
              var entry = this.props.entry;
              var gambarRaw = entry.getIn(["data", "gambar"]);
              var gambar = gambarRaw ? this.props.getAsset(gambarRaw) : null;
              var urutan = entry.getIn(["data", "urutan"]) || 1;

              return h(
                "div",
                { className: "kc-card" },
                gambar
                  ? h("img", { src: gambar.toString(), className: "kc-media", style: { height: "250px" } })
                  : h(
                      "div",
                      {
                        className: "kc-media",
                        style: {
                          display: "flex",
                          alignItems: "center",
                          justifyContent: "center",
                          color: "#6b6057",
                          fontSize: "14px",
                        },
                      },
                      "Pilih atau unggah foto suasana"
                    ),
                h("div", { className: "kc-body kc-meta" }, "Urutan Tampil: " + urutan)
              );
            },
          })
        );
      }
    </script>
  </body>
</html>

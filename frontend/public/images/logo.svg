<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none">
  <!-- Brand Emblem (Coffee Cup & Sun Disc) -->
  <g transform="translate(10, 10)">
    <!-- Outer ring badge -->
    <circle cx="30" cy="30" r="28" fill="#2c1c0f" stroke="#fcbf27" stroke-width="2.5"/>
    <circle cx="30" cy="30" r="25" fill="#23160c"/>
    
    <!-- Cup Body -->
    <path d="M19 28 C19 40 23 44 30 44 C37 44 41 40 41 28 Z" fill="#eee6d7"/>
    <!-- Coffee Surface -->
    <ellipse cx="30" cy="28" rx="11" ry="3.5" fill="#fcbf27"/>
    
    <!-- Cup Handle -->
    <path d="M40 30 C45 30 47 32 47 35 C47 38 44 40 40 40" stroke="#eee6d7" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    
    <!-- Saucer -->
    <path d="M17 46 C23 48 37 48 43 46" stroke="#fcbf27" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Steams -->
    <path d="M26 23 C24 19 27 17 26 13" stroke="#fcbf27" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M30 22 C29 18 32 16 31 12" stroke="#eee6d7" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M34 23 C33 19 35 17 34 13" stroke="#fcbf27" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Typography: Wordmark -->
  <text x="82" y="38" fill="#fcbf27" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="25" font-weight="900" letter-spacing="1.5">KONTRAKAN</text>
  <text x="83" y="56" fill="#eee6d7" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="6">COFFEE</text>
  
  <!-- Subtle aesthetic separator line -->
  <line x1="83" y1="44" x2="250" y2="44" stroke="#fcbf27" stroke-width="1" stroke-opacity="0.25"/>
</svg>


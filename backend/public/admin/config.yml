backend:
  name: git-gateway
  branch: main

local_backend:
  url: http://localhost:8081/api/v1
  allowed_hosts: ['192.168.68.230', '192.168.68.*', '192.168.*', 'localhost', '127.0.0.1']
publish_mode: editorial_workflow    # PRD §2 no.8: draft -> review/pratinjau -> publish

media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  - name: menu
    label: Menu
    folder: content/menu
    create: true
    slug: "{{slug}}"
    identifier_field: nama
    summary: "{{nama}} — Rp{{harga}} ({{kategori}})"
    fields:
      - { label: Nama Menu, name: nama, widget: string, hint: "Contoh: Es Kopi Susu Kontrakan" }
      - label: Kategori
        name: kategori
        widget: relation
        collection: kategori
        search_fields: [nama]
        value_field: "{{slug}}"
        display_fields: [nama]
      - { label: "Harga (Rp)", name: harga, widget: number, value_type: int, min: 0, hint: "Masukkan angka tanpa titik/koma, contoh: 18000" }
      - { label: Foto Menu, name: foto, widget: image, default: "/images/placeholder-coffee.svg" }
      - { label: Pilihan Ukuran, name: ukuran, widget: list, required: false, hint: "Contoh: Regular, Large" }
      - { label: "Pilihan Rasa / Varian", name: rasa, widget: list, required: false, hint: "Contoh: Aren, Pandan, Hazelnut" }
      - { label: Tandai Menu Rekomendasi, name: rekomendasi, widget: boolean, default: false }
      - { label: Tampilkan di Web, name: aktif, widget: boolean, default: true }
      - { label: Deskripsi Lengkap, name: body, widget: markdown, hint: "Jelaskan rasa, komposisi, atau cerita menu ini" }

  - name: kategori
    label: Kategori
    folder: content/kategori
    extension: yml
    format: yml
    create: true
    slug: "{{slug}}"
    identifier_field: nama
    summary: "{{nama}} (Urutan: {{urutan}})"
    fields:
      - { label: Nama Kategori, name: nama, widget: string, hint: "Contoh: Kopi, Non-Kopi, Camilan" }
      - { label: Urutan Tampil, name: urutan, widget: number, value_type: int, default: 1 }

  - name: galeri
    label: Galeri Suasana
    folder: content/galeri
    create: true
    slug: "{{slug}}"
    identifier_field: judul
    summary: "{{filename}} (Urutan: {{fields.urutan}})"
    fields:
      - { label: Berkas Foto, name: gambar, widget: image, hint: "Pilih atau unggah berkas foto kafe" }
      - { label: Urutan Tampil, name: urutan, widget: number, value_type: int, default: 1 }
      - { label: Judul, name: judul, widget: hidden, default: "Foto Suasana" }

  - name: promo
    label: Promo & Kegiatan
    folder: content/promo
    create: true
    slug: "{{slug}}"
    identifier_field: judul
    summary: "{{judul}} ({{tipe}})"
    fields:
      - { label: Judul Promo / Kegiatan, name: judul, widget: string }
      - { label: Tipe, name: tipe, widget: select, options: [promo, kegiatan], default: promo }
      - { label: Keterangan Singkat, name: deskripsi, widget: text }
      - { label: Tanggal Berakhir, name: tanggal_selesai, widget: datetime, time_format: false, format: "YYYY-MM-DD", hint: "Tanggal berakhirnya promo/kegiatan" }
      - { label: Banner Gambar, name: gambar, widget: image, required: false }
      - { label: Tampilkan, name: aktif, widget: boolean, default: true }

  - name: pengaturan
    label: Pengaturan & Konten Toko
    files:
      - name: info_toko
        label: Informasi Coffee Shop & Jam Buka
        file: content/info-toko.json
        fields:
          - { label: Nama Coffee Shop, name: nama_toko, widget: string }
          - { label: Judul Kenapa Kontrakan, name: judul_kenapa, widget: string, default: "Betah Berjam-jam. Kenapa Kontrakan?", hint: "Judul utama bagian fasilitas / Kenapa Kontrakan" }
          - { label: Alamat Lengkap, name: alamat, widget: text }
          - { label: Patokan Lokasi, name: patokan, widget: string, required: false, hint: "Contoh: Kawasan Sekaran, Gunungpati — dekat kampus UNNES" }
          - { label: Link Google Maps, name: link_peta, widget: string, hint: "URL Google Maps untuk tombol Buka Peta" }
          - { label: Link Embed Google Maps (iframe), name: embed_peta, widget: string, required: false, hint: "Opsional. Jika kosong, sistem otomatis membuat embed peta dari alamat di atas" }
          - { label: Tautan Akun Instagram, name: instagram, widget: string, hint: "Contoh: https://www.instagram.com/kontrakan.coffee" }
          - { label: Tautan Akun TikTok, name: tiktok, widget: string, required: false, hint: "Contoh: https://www.tiktok.com/@kontrakancoffee" }
          - { label: Nomor WhatsApp, name: whatsapp, widget: string, required: false, hint: "Contoh: 6281234567890" }
          - label: Jam Buka Mingguan
            name: jam_buka
            widget: list
            fields:
              - { label: Hari, name: hari, widget: select, options: [Senin, Selasa, Rabu, Kamis, Jumat, Sabtu, Minggu] }
              - { label: Jam Buka, name: buka, widget: string, hint: "Contoh: 09:00" }
              - { label: Jam Tutup, name: tutup, widget: string, hint: "Contoh: 23:00 atau 24:00" }
              - { label: Tutup / Libur, name: libur, widget: boolean, default: false }

      - name: why_section
        label: Section Why / Kenapa Kontrakan (Fasilitas)
        file: content/why.json
        fields:
          - { label: Judul Section Why, name: judul, widget: string, default: "Betah Berjam-jam. Kenapa Kontrakan?", hint: "Judul besar bagian Kenapa Kontrakan" }
          - { label: Deskripsi Singkat, name: deskripsi, widget: string, required: false, default: "Fasilitas lengkap dan suasana nyaman yang dirancang untuk produktivitas dan momen santai Anda." }
          - { label: Foto Latar Belakang (Backdrop), name: foto_backdrop, widget: image, required: false, hint: "Foto background untuk section Why / Fasilitas" }
          - label: Daftar Fasilitas / Keunggulan (Cards)
            name: items
            widget: list
            summary: "{{fields.title}} ({{fields.icon}})"
            fields:
              - label: Pilihan Ikon
                name: icon
                widget: select
                options:
                  - { label: "Wi-Fi Kencang", value: "wifi" }
                  - { label: "Stopkontak / Colokan", value: "plug" }
                  - { label: "AC / Dingin", value: "wind" }
                  - { label: "Taman / Outdoor", value: "trees" }
                  - { label: "Parkir Luas", value: "car" }
                  - { label: "Musholla Nyaman", value: "sparkles" }
                  - { label: "Kopi / Barista", value: "coffee" }
                  - { label: "Buku / Baca", value: "book" }
                  - { label: "Aman / Satpam", value: "shield" }
                  - { label: "Jam Fleksibel", value: "clock" }
                  - { label: "Komunitas / Diskusi", value: "users" }
                default: "wifi"
              - { label: Judul Fasilitas, name: title, widget: string, hint: "Contoh: Wi-Fi Kencang 100 Mbps" }
              - { label: Penjelasan Fasilitas, name: desc, widget: text, hint: "Deskripsi fasilitas atau keunggulan" }
